[package]
name = "diddycord"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
publish = false
description = "Ultra-low-overhead cross-platform Discord Gateway client core"

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
# Keep the TLS adapter on its pre-1.85 MSRV release; reqwest accepts any 0.27.x.
hyper-rustls = { version = "=0.27.7", default-features = false }
reqwest = { version = "=0.12.18", default-features = false, features = ["rustls-tls-webpki-roots-no-provider"] }
rustls = { version = "=0.23.44", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.151", default-features = false, features = ["raw_value", "std"] }
tokio = { version = "~1.47.0", default-features = false, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["connect", "rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
# reqwest accepts url >=2.4; 2.4.1 keeps the pre-ICU IDNA stack, lowering MSRV and footprint.
url = "=2.4.1"
zeroize = "=1.8.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false
