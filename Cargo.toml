[package]
name = "diddycord"
version = "0.6.0"
edition = "2021"
rust-version = "1.77"
publish = false
description = "Ultra-low-overhead cross-platform graphical Discord bot client core"

[lib]
# Android NativeActivity loads a shared library, while desktop binaries/tests still link the rlib.
crate-type = ["rlib", "cdylib"]

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
# Keep the TLS adapter on its pre-1.85 MSRV release; reqwest accepts any 0.27.x.
hyper-rustls = { version = "=0.27.7", default-features = false }
reqwest = { version = "=0.12.18", default-features = false, features = ["rustls-tls-webpki-roots-no-provider"] }
rustls = { version = "=0.23.44", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.151", default-features = false, features = ["raw_value", "std"] }
tokio = { version = "~1.47.0", default-features = false, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["connect", "rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
# reqwest accepts url >=2.4; 2.4.1 keeps the pre-ICU IDNA stack, lowering MSRV and footprint.
url = "=2.4.1"
zeroize = "=1.8.1"

# eframe 0.27.2 is the GUI baseline: its declared MSRV is Rust 1.72 and it uses winit 0.29.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "=0.27.2", default-features = false, features = ["default_fonts", "glow", "x11"] }
# eframe 0.27 enables egui-winit clipboard support, whose broad 0.7 smithay-clipboard range now resolves
# to releases using edition-2024 Wayland crates. 0.7.0 declares Rust 1.65 and stays on SCTK 0.18.
smithay-clipboard = "=0.7.0"
# These ranges are broad in the 0.27-era GUI graph. Pin them before later releases switched their
# hash/TOML/XML/build/text tooling to versions newer than the Rust 1.77.2 baseline.
indexmap = "=2.2.6"
num_enum = "=0.7.2"
proc-macro-crate = "=3.1.0"
wayland-scanner = "=0.31.7"
quick-xml = "=0.37.5"
jobserver = "=0.1.32"
unicode-segmentation = "=1.12.0"
# Pin broad eframe transitive ranges so Cargo 1.77.2 does not drift into newer-MSRV releases.
arboard = "=3.3.2"
home = "=0.5.9"
webbrowser = "=0.8.13"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
eframe = { version = "=0.27.2", default-features = false, features = ["default_fonts", "glow"] }
indexmap = "=2.2.6"
num_enum = "=0.7.2"
proc-macro-crate = "=3.1.0"
wayland-scanner = "=0.31.7"
quick-xml = "=0.37.5"
jobserver = "=0.1.32"
unicode-segmentation = "=1.12.0"
arboard = "=3.3.2"
home = "=0.5.9"
webbrowser = "=0.8.13"

# Android uses the same immediate-mode GUI and rendering stack, but a NativeActivity entry point.
# winit 0.29.15 and android-activity 0.5.2 both support the Rust 1.77 / API 23 baseline.
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "=0.27.2", default-features = false, features = ["default_fonts", "glow", "android-native-activity"] }
winit = { version = "=0.29.15", default-features = false, features = ["android-native-activity", "rwh_05"] }
android-activity = { version = "=0.5.2", default-features = false, features = ["native-activity"] }

[package.metadata.android]
package = "io.github.diddycord.client"
apk_name = "diddycord"
build_targets = ["aarch64-linux-android"]
strip = "strip"

[package.metadata.android.sdk]
min_sdk_version = 23
target_sdk_version = 35

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.application]
label = "Diddycord"
theme = "@android:style/Theme.DeviceDefault.NoActionBar"
extract_native_libs = true
uses_cleartext_traffic = false

[package.metadata.android.application.activity]
config_changes = "orientation|keyboard|keyboardHidden|screenSize"
launch_mode = "singleTop"
orientation = "unspecified"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false
