name: Chapter 20 one-shot GUI patch

on:
  push:
    branches:
      - chapter-20-gui-gateway-latency

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: chapter-20-gui-gateway-latency
      - name: Add Gateway latency to graphical status bars
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/gui_app.rs")
          text = path.read_text()

          replacements = [
              (
                  "            ui.label(network_status_label(session.control.status()));\n\n            if let Some(user) = session.control.self_user() {",
                  "            ui.label(network_status_label(session.control.status()));\n            if let Some(latency) = gateway_latency_label(session.control.latency()) {\n                ui.separator();\n                ui.label(latency);\n            }\n\n            if let Some(user) = session.control.self_user() {",
                  "desktop status bar",
              ),
              (
                  "    let status = network_status_label(session.control.status());\n    let self_name = session\n        .control",
                  "    let status = network_status_label(session.control.status());\n    let latency = gateway_latency_label(session.control.latency());\n    let self_name = session\n        .control",
                  "mobile latency snapshot",
              ),
              (
                  "            ui.small(status.as_str());\n            if let Some(name) = self_name.as_deref() {",
                  "            ui.small(status.as_str());\n            if let Some(latency) = latency.as_deref() {\n                ui.separator();\n                ui.small(latency);\n            }\n            if let Some(name) = self_name.as_deref() {",
                  "mobile status row",
              ),
              (
                  "fn network_status_label(status: NetworkStatus) -> String {",
                  "fn gateway_latency_label(latency: Option<Duration>) -> Option<String> {\n    latency.map(|latency| format!(\"Gateway {} ms\", latency.as_millis()))\n}\n\nfn network_status_label(status: NetworkStatus) -> String {",
                  "latency label helper",
              ),
          ]

          for old, new, name in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one {name} anchor, found {count}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          git rm .github/workflows/chapter20-gui-patch.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: show Gateway latency in graphical status bars"
          git push origin HEAD:chapter-20-gui-gateway-latency
