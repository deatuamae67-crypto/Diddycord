name: Chapter 21 one-shot unread patch

on:
  push:
    branches:
      - chapter-21-local-unread

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: chapter-21-local-unread
      - name: Add bounded local unread markers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/gui_app.rs")
          text = path.read_text()

          activity_methods = "    fn drain_activity(&mut self, budget: usize) {\n        let mut processed = 0usize;\n        while processed < budget {\n            match self.activity_events.try_recv() {\n                Ok(event) => {\n                    processed += 1;\n                    self.apply_activity(event.as_ref());\n                }\n                Err(broadcast::error::TryRecvError::Lagged(_)) => {\n                    processed += 1;\n                    self.unread_channels.clear();\n                }\n                Err(broadcast::error::TryRecvError::Empty) => break,\n                Err(broadcast::error::TryRecvError::Closed) => break,\n            }\n        }\n    }\n\n    fn apply_activity(&mut self, event: &FrontendEvent) {\n        match event {\n            FrontendEvent::Message(message) => {\n                let channel_id = message.channel_id.as_ref();\n                if self.selected_channel.as_deref() == Some(channel_id) {\n                    self.clear_unread(channel_id);\n                } else {\n                    self.mark_unread(channel_id);\n                }\n            }\n            FrontendEvent::ChannelDelete(delete) => self.clear_unread(delete.channel_id.as_ref()),\n            FrontendEvent::DirectChannelDelete(delete) => {\n                self.clear_unread(delete.channel_id.as_ref())\n            }\n            FrontendEvent::ThreadDelete(delete) => self.clear_unread(delete.id.as_ref()),\n            _ => {}\n        }\n    }\n\n    fn mark_unread(&mut self, channel_id: &str) {\n        if let Some(index) = self\n            .unread_channels\n            .iter()\n            .position(|unread| unread.channel_id.as_ref() == channel_id)\n        {\n            let mut unread = self.unread_channels.remove(index);\n            unread.count = unread\n                .count\n                .saturating_add(1)\n                .min(MAX_UNREAD_PER_CHANNEL);\n            self.unread_channels.push(unread);\n            return;\n        }\n\n        if self.unread_channels.len() >= MAX_UNREAD_CHANNELS {\n            self.unread_channels.remove(0);\n        }\n        self.unread_channels.push(UnreadChannel {\n            channel_id: Box::<str>::from(channel_id),\n            count: 1,\n        });\n    }\n\n    fn clear_unread(&mut self, channel_id: &str) {\n        self.unread_channels\n            .retain(|unread| unread.channel_id.as_ref() != channel_id);\n    }\n\n    fn unread_count(&self, channel_id: &str) -> u16 {\n        self.unread_channels\n            .iter()\n            .find(|unread| unread.channel_id.as_ref() == channel_id)\n            .map(|unread| unread.count)\n            .unwrap_or(0)\n    }\n\n    fn select_guild(&mut self, guild_id: Box<str>) {"

          replacements = [
              ("const DEFAULT_HISTORY_PAGE: u8 = 50;", "const DEFAULT_HISTORY_PAGE: u8 = 50;\nconst MAX_UNREAD_CHANNELS: usize = 128;\nconst MAX_UNREAD_PER_CHANNEL: u16 = 99;", "unread bounds"),
              ("struct GuiSession {\n    control: NetworkControl,", "struct UnreadChannel {\n    channel_id: Box<str>,\n    count: u16,\n}\n\nstruct GuiSession {\n    control: NetworkControl,", "unread record"),
              ("    gateway_events: broadcast::Receiver<Arc<FrontendEvent>>,\n    direct_events: broadcast::Receiver<Arc<FrontendEvent>>,", "    gateway_events: broadcast::Receiver<Arc<FrontendEvent>>,\n    direct_events: broadcast::Receiver<Arc<FrontendEvent>>,\n    activity_events: broadcast::Receiver<Arc<FrontendEvent>>,", "activity receiver field"),
              ("    selected_channel_name: Option<Box<str>>,\n    compose: String,", "    selected_channel_name: Option<Box<str>>,\n    unread_channels: Vec<UnreadChannel>,\n    compose: String,", "unread state field"),
              ("        let gateway_events = backbone.subscribe();\n        let direct_events = backbone.subscribe();", "        let gateway_events = backbone.subscribe();\n        let direct_events = backbone.subscribe();\n        let activity_events = backbone.subscribe();", "activity subscription"),
              ("            gateway_events,\n            direct_events,\n            rest_events,", "            gateway_events,\n            direct_events,\n            activity_events,\n            rest_events,", "activity receiver initialization"),
              ("            selected_channel: None,\n            selected_channel_name: None,\n            compose: String::new(),", "            selected_channel: None,\n            selected_channel_name: None,\n            unread_channels: Vec::with_capacity(16),\n            compose: String::new(),", "unread state initialization"),
              ("    fn poll(&mut self) {\n        self.state", "    fn poll(&mut self) {\n        self.drain_activity(GATEWAY_EVENT_BUDGET);\n        self.state", "activity draining"),
              ("    fn select_guild(&mut self, guild_id: Box<str>) {", activity_methods, "activity methods"),
              ("    fn select_channel(&mut self, channel_id: Box<str>, name: Box<str>) {\n        let changed = self.selected_channel.as_deref() != Some(channel_id.as_ref());\n        self.selected_channel = Some(channel_id.clone());", "    fn select_channel(&mut self, channel_id: Box<str>, name: Box<str>) {\n        let changed = self.selected_channel.as_deref() != Some(channel_id.as_ref());\n        self.clear_unread(channel_id.as_ref());\n        self.selected_channel = Some(channel_id.clone());", "selection clearing"),
              ("                let selected = session.selected_channel.as_deref() == Some(id.as_ref());\n                if ui.selectable_label(selected, name.as_ref()).clicked() {\n                    session.select_channel(id, name);", "                let selected = session.selected_channel.as_deref() == Some(id.as_ref());\n                let label = unread_label(name.to_string(), session.unread_count(id.as_ref()));\n                if ui.selectable_label(selected, label).clicked() {\n                    session.select_channel(id, name);", "DM unread label"),
              ("            let label = if text_capable {\n                format!(\"# {}\", name)\n            } else {\n                format!(\"· {}\", name)\n            };\n            let response =", "            let label = if text_capable {\n                format!(\"# {}\", name)\n            } else {\n                format!(\"· {}\", name)\n            };\n            let label = unread_label(label, session.unread_count(id.as_ref()));\n            let response =", "guild unread label"),
              ("                let selected = session.selected_channel.as_deref() == Some(id.as_ref());\n                if ui.selectable_label(selected, format!(\"↳ {name}\")).clicked() {\n                    session.select_channel(id, name);", "                let selected = session.selected_channel.as_deref() == Some(id.as_ref());\n                let label = unread_label(format!(\"↳ {name}\"), session.unread_count(id.as_ref()));\n                if ui.selectable_label(selected, label).clicked() {\n                    session.select_channel(id, name);", "thread unread label"),
              ("fn gateway_latency_label(latency: Option<Duration>) -> Option<String> {", "fn unread_label(label: String, count: u16) -> String {\n    if count == 0 {\n        label\n    } else {\n        format!(\"{label}  • {count}\")\n    }\n}\n\nfn gateway_latency_label(latency: Option<Duration>) -> Option<String> {", "unread label helper"),
          ]

          for old, new, name in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one {name} anchor, found {count}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          git rm .github/workflows/chapter21-gui-patch.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add bounded local unread markers"
          git push origin HEAD:chapter-21-local-unread
