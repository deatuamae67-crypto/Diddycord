name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux-msrv:
    name: Linux / Rust 1.77.2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.77.2 --profile minimal --component rustfmt
          rustup override set 1.77.2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --all-targets
      - name: Test
        run: cargo test --all-targets
      - name: Upload resolved lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock-linux
          path: Cargo.lock
          if-no-files-found: ignore

  windows-msrv:
    name: Windows / Rust 1.77.2
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.77.2 --profile minimal
          rustup override set 1.77.2
      - name: Check
        run: cargo check --all-targets

  android-api23:
    name: Android 6+ GUI APK / aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-apk packager
        run: cargo +stable install cargo-apk --version 0.10.0 --locked
      - name: Install pinned Rust toolchain and Android target
        run: |
          rustup toolchain install 1.77.2 --profile minimal
          rustup override set 1.77.2
          rustup target add aarch64-linux-android --toolchain 1.77.2
      - name: Install Android SDK/NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"
      - name: Check Android GUI
        env:
          CC_aarch64_linux_android: ${{ github.workspace }}/.ci/android-cc
          AR_aarch64_linux_android: ${{ github.workspace }}/.ci/android-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ github.workspace }}/.ci/android-cc
        run: |
          mkdir -p .ci
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          printf '#!/bin/sh\nexec "%s/aarch64-linux-android23-clang" "$@"\n' "$TOOLCHAIN" > .ci/android-cc
          printf '#!/bin/sh\nexec "%s/llvm-ar" "$@"\n' "$TOOLCHAIN" > .ci/android-ar
          chmod +x .ci/android-cc .ci/android-ar
          cargo check --target aarch64-linux-android --lib
      - name: Create CI APK signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/diddycord-ci.keystore" \
            -storepass android \
            -keypass android \
            -alias diddycord-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Diddycord CI,O=Diddycord,C=PT"
      - name: Build installable Android APK
        env:
          CARGO_APK_RELEASE_KEYSTORE: ${{ runner.temp }}/diddycord-ci.keystore
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: android
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export ANDROID_NDK_HOME="$NDK_HOME"
          cargo apk build --release --lib
          test -f target/release/apk/diddycord.apk
          sha256sum target/release/apk/diddycord.apk > target/release/apk/diddycord.apk.sha256
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: diddycord-android-api23-aarch64
          path: |
            target/release/apk/diddycord.apk
            target/release/apk/diddycord.apk.sha256
          if-no-files-found: error
